  <line x1="155" y1="130" x2="175" y2="126" stroke="#222" stroke-width="4" stroke-linecap="round"/>
  <circle cx="165" cy="130" r="5" fill="#cc0000"/>

  <!-- Headlight -->
  <path d="M130 138 L142 128 L150 132 L140 145 Z" fill="#fffde0" stroke="#ddd090" stroke-width="1"/>
  <circle cx="138" cy="137" r="4" fill="#ffee88" opacity="0.8"/>

  <!-- Windshield -->
  <path d="M148 125 L160 114 L178 116 L175 128 L155 132 Z" fill="#c8e8ff" opacity="0.6" stroke="#7ab0d0" stroke-width="1"/>

  <!-- Exhaust -->
  <path d="M200 160 Q220 165 245 162 L250 168 Q225 172 200 167 Z" fill="#888" opacity="0.8"/>

  <!-- Accent stripe -->
  <path d="M155 145 Q185 140 215 143" stroke="#cc0000" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Label -->
  <text x="200" y="15" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#cc0000" opacity="0.9">HONDA VARIO 160</text>
</svg>