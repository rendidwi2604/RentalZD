      <stop offset="0%" style="stop-color:#d4e8f4"/>
      <stop offset="100%" style="stop-color:#6090b8"/>
    </linearGradient>
    <radialGradient id="whvario.svg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#666"/>
      <stop offset="70%" style="stop-color:#222"/>
      <stop offset="100%" style="stop-color:#111"/>
    </radialGradient>
  </defs>
  <!-- background tint -->
  <rect width="400" height="220" fill="#d4e8f4" opacity="0.15" rx="12"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="200" rx="130" ry="10" fill="#00000030"/>

  <!-- Rear wheel -->
  <circle cx="270" cy="175" r="40" fill="#111"/>
  <circle cx="270" cy="175" r="30" fill="url(#whvario.svg)"/>
  <circle cx="270" cy="175" r="18" fill="#2a2a2a"/>
  <circle cx="270" cy="175" r="8" fill="#444"/>
  <line x1="270" y1="147" x2="270" y2="203" stroke="#555" stroke-width="2.5"/>
  <line x1="242" y1="175" x2="298" y2="175" stroke="#555" stroke-width="2.5"/>
  <line x1="250" y1="155" x2="290" y2="195" stroke="#555" stroke-width="2"/>
  <line x1="290" y1="155" x2="250" y2="195" stroke="#555" stroke-width="2"/>

  <!-- Front wheel -->
  <circle cx="105" cy="175" r="38" fill="#111"/>
  <circle cx="105" cy="175" r="28" fill="url(#whvario.svg)"/>
  <circle cx="105" cy="175" r="16" fill="#2a2a2a"/>
  <circle cx="105" cy="175" r="7" fill="#444"/>
  <line x1="105" y1="149" x2="105" y2="201" stroke="#555" stroke-width="2.5"/>
  <line x1="79" y1="175" x2="131" y2="175" stroke="#555" stroke-width="2.5"/>
  <line x1="86" y1="156" x2="124" y2="194" stroke="#555" stroke-width="2"/>
  <line x1="124" y1="156" x2="86" y2="194" stroke="#555" stroke-width="2"/>

  <!-- Frame / swing arm -->
  <path d="M270 175 Q240 170 210 165 L190 145 L170 140 L145 148" stroke="#6090b8" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Engine block -->
  <path d="M175 145 L200 138 L210 148 L200 162 L175 158 Z" fill="#cc0000" opacity="0.85"/>
  <rect x="182" y="148" width="18" height="8" rx="3" fill="#d4e8f4" opacity="0.6"/>

  <!-- Body / fairing -->
  <path d="M145 148 Q130 155 125 165 L125 175 L145 175 L145 148" fill="#6090b8"/>
  <path d="M145 140 L175 128 L210 130 L220 142 L215 155 L185 162 L155 158 Z" fill="url(#bgvario.svg)"/>
  <path d="M175 128 L215 132 L218 128 L208 120 Q198 115 185 118 Z" fill="#cc0000" opacity="0.9"/>

  <!-- Seat -->
  <path d="M200 130 Q230 125 260 128 L265 138 Q240 135 210 142 Z" fill="#1a1a1a"/>
  <path d="M202 132 Q232 127 258 130" stroke="#333" stroke-width="1.5" fill="none"/>

  <!-- Rear fairing -->
  <path d="M255 128 L270 135 L278 150 L270 165 L255 160 L245 145 Z" fill="url(#bgvario.svg)"/>
  <path d="M265 135 L278 148" stroke="#cc0000" stroke-width="2" opacity="0.7"/>

  <!-- Taillight -->
  <path d="M273 148 L280 148 L280 158 L273 158 Z" fill="#ff4444" opacity="0.9" rx="2"/>

  <!-- Front fork -->
  <line x1="145" y1="148" x2="118" y2="178" stroke="#6090b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="135" y1="142" x2="108" y2="172" stroke="#d4e8f4" stroke-width="3" stroke-linecap="round"/>

  <!-- Handlebar -->
